<style>
:root{--bg:#edf0f5;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--navy:#0f2443;--accent:#2563eb;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#top{background:var(--navy);color:#fff;padding:max(10px,env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0}
#top img{height:28px;width:auto;background:#fff;border-radius:6px;padding:2px 5px}
#top h1{font-size:15px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.12);border:0;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex-shrink:0}
.tb:active{background:rgba(255,255,255,.25)}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 90px}
#tabs{display:flex;background:var(--card);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;border:0;background:none;padding:9px 4px 8px;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
#tabs button b{font-size:19px}
#tabs button.on{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px}
.hdr{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr .n{font-weight:800;font-size:16px;line-height:1.2}.hdr .s{font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5}
.b-ok{background:var(--ok);color:#fff}.b-pri{background:var(--accent);color:#fff}.b-warn{background:#fef3c7;color:#92400e}.b-gh{background:#f1f5f9;color:var(--text)}.b-bad{background:#fee2e2;color:#991b1b}
.big{width:100%;min-height:62px;font-size:17px}
.row{display:flex;gap:10px}.row>*{flex:1}
h3{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px}
.timer{border-left:6px solid var(--ok)}.timer.p{border-left-color:var(--warn)}
.timer .k{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-weight:700}
.clock{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:40px;font-weight:800;letter-spacing:1px;margin:4px 0 2px;line-height:1.1}
.timer.p .clock{color:var(--warn)}
.timer .w{font-weight:800;font-size:15px}.timer .d{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:800}
.pill.ok{background:#dcfce7;color:#166534}.pill.p{background:#fef3c7;color:#92400e}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.who{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:12px 10px;text-align:left;cursor:pointer;display:flex;gap:9px;align-items:center;min-height:60px}
.who:active{border-color:var(--accent)}.who .av{width:36px;height:36px;font-size:13px}.who span{font-size:13px;font-weight:700;line-height:1.2}
.who i{margin-left:auto;font-style:normal;font-size:11px;background:#dcfce7;color:#166534;border-radius:99px;padding:2px 7px;font-weight:800}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],select,textarea{width:100%;padding:13px 12px;border:1.5px solid var(--border);border-radius:12px;background:#fff;font-size:16px;min-height:50px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label.l{display:block;font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:12px 2px 5px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--border);background:#fff;border-radius:12px;padding:11px 6px;font-weight:700;font-size:13.5px;cursor:pointer;min-height:48px}
.seg button.on{border-color:var(--accent);background:#eff6ff;color:var(--accent)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}

.chip.on{border-color:var(--accent);background:#eff6ff;color:var(--accent)}
.it{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:7px;cursor:pointer;background:#fff}

.sheet{background:#fff;width:min(560px,100%);max-height:94vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}

.sheet h2{font-size:17px;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.x{border:0;background:#f1f5f9;border-radius:10px;width:36px;height:36px;font-size:15px;cursor:pointer}
.day{display:flex;justify-content:space-between;font-weight:800;font-size:13px;padding:10px 2px 6px}

.wk-p{position:absolute;inset:0;border:2px dashed #f59e0b;border-radius:6px;background:rgba(251,191,36,.08);pointer-events:none}.wk-p.ok{border-color:#16a34a;background:rgba(34,197,94,.08)}
.wk-now{position:absolute;left:0;right:0;height:2px;background:#ef4444;z-index:3;pointer-events:none}
.mes-h{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:3px}.mes-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mes-d{position:relative;min-height:62px;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}.mes-d.fu{opacity:.4}.mes-d span{font-size:12px;font-weight:800}.mes-d i{font-style:normal;color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px}.mes-d em{font-style:normal;font-size:8px;color:var(--muted);line-height:1.1;text-align:center}.mes-d.hoy span{background:var(--accent);color:#fff;border-radius:99px;padding:0 6px}.mes-d.sel{border-color:var(--accent);background:#eff6ff}.mes-d u{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:#f59e0b}.mes-d u.ok{background:#16a34a}

<script>
const SB_URL='https://rarjcuoapvrfqrzuhsbi.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhcmpjdW9hcHZyZnFyenVoc2JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3OTM4MDcsImV4cCI6MjEwNTM2OTgwN30.6ftoBVT9gPOOcuqUf8UY3aiIoyB3ZJFhpp_1Hyfu_js';
const TIPOS=[['Trabajo normal #OP','🔧','Trabajo en OP'],['Parada de máquina','⏸️','Parada'],['Mantenimiento','🛠️','Mantenimiento'],['Reproceso','♻️','Reproceso']];
const ICON=Object.fromEntries(TIPOS.map(t=>[t[0],t[1]])), LBL=Object.fromEntries(TIPOS.map(t=>[t[0],t[2]]));
const S={login:null,ses:null,view:'reg',hor:null,horCarg:false,cat:null,op:'',timers:[],all:[],hist:[],skew:0,tab:'mi',busy:false};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const limpio=n=>String(n||'').replace(/\s+/g,' ').trim();
const inic=n=>limpio(n).split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
function toast(m,err){ const t=$('toast'); t.textContent=m; t.className=err?'err':''; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none',err?4500:2200); }
// ── API ──
const sb={
  h(){ const h={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'}; return h; },
  async get(t,q){ const r=await fetch(SB_URL+'/rest/v1/'+t+(q?'?'+q:''),{headers:this.h()}); const d=r.headers.get('date'); if(d){ const x=new Date(d).getTime(); if(x) S.skew=x-Date.now(); }
    if(!r.ok) throw await falla(r); return r.json(); },
  async rpc(f,p){ const r=await fetch(SB_URL+'/rest/v1/rpc/'+f,{method:'POST',headers:this.h(),body:JSON.stringify(p||{})}); const d=r.headers.get('date'); if(d){ const x=new Date(d).getTime(); if(x) S.skew=x-Date.now(); } if(!r.ok) throw await falla(r); const t=await r.text(); return t?JSON.parse(t):null; }
};
async function falla(r){ let m='Error '+r.status; try{ const j=await r.json(); m=j.message||j.hint||m; }catch(e){}
  if(/Failed to fetch|NetworkError/i.test(m)) m='Sin conexión'; return new Error(m); }
const ahora=()=>Date.now()+S.skew;
// ── INICIO ──
async function iniciar(){
  $('main').innerHTML='<div class="empty">Cargando…</div>';
  if(S.login==null){ try{ S.login=!!(await sb.rpc('planta_login_activo')); }catch(e){ S.login=false; } }
  if(S.login&&!S.ses){ try{ const g=JSON.parse(localStorage.getItem('planta_ses')||'null'); if(g&&g.token&&new Date(g.expira)>new Date()){ S.ses=g; S.view='fic'; } }catch(e){} }
  if(S.login&&!S.ses){ pantallaLogin(); return; }
  try{ S.cat=await sb.rpc('tiempos_catalogo'); }
  catch(e){ $('main').innerHTML=`<div class="card"><b>⚠️ No se pudo cargar</b><p class="muted" style="margin:6px 0 12px">${esc(e.message)}</p>${/tiempos_catalogo|does not exist|Could not find/i.test(e.message)?'<p class="muted" style="margin-bottom:12px">Falta ejecutar <b>03_tiempos_operarios.sql</b> en Supabase (SQL Editor).</p>':''}<button class="btn b-pri" onclick="iniciar()">Reintentar</button></div>`; return; }
  S.cat=S.cat||{}; if(S.ses) await cargarCfg(); await refrescar(); }
async function cargarCfg(){ if(S.ses&&!S.perfil&&!S.perfCarg){ S.perfCarg=true; cargarPerfil().finally(()=>S.perfCarg=false); } try{ const c=await sb.rpc('planta_config'); const ch=!S.cfg||S.cfg.fichaje!==c.fichaje||S.cfg.permisos!==c.permisos; S.cfg=c; if(ch&&S.ses) pintar(); }catch(e){ if(!S.cfg) S.cfg={fichaje:false,permisos:false}; } }
async function refrescar(manual){ if(S.ses) cargarCfg();
  const b=$('bsync'); if(b) b.style.opacity=.5;
  try{
    const r=await sb.rpc('tiempos_planta',{p_col:null}); S.all=r.en_curso||[]; S.hist=r.hist||[];
    if(manual) toast('Actualizado');
  }catch(e){ if(manual||!S.all.length) toast(e.message,true); }
  if(b) b.style.opacity=1; pintar();

const lunDe=d=>addDias(d,-((d.getDay()+6)%7));
function hmParse(str){ // "8:30 am – 5:00 pm" → [510,1020] ; fin<=ini → pasa medianoche
  if(!str) return null; const m=String(str).match(/(\d{1,2}):(\d{2})\s*(am|pm)?\s*[–-]\s*(\d{1,2}):(\d{2})\s*(am|pm)?/i); if(!m) return null;
  const f=(h,mi,s)=>{ h=+h%12; if(String(s).toLowerCase()==='pm') h+=12; return h*60+ +mi; };
  const sf=m[3]||m[6], ef=m[6]||m[3]; let a=f(m[1],m[2],sf), b=f(m[4],m[5],ef);
  if(!m[3]&&a>b&&!(m[6]&&b>=a)) a-=720; // "9:00 – 9:20 am"
  if(b<=a) b+=1440; return [a,b]; }
function hmTxt(m){ m=((m%1440)+1440)%1440; const h=Math.floor(m/60), mi=m%60, s=h>=12?'pm':'am', h12=h%12||12; return h12+(mi?':'+String(mi).padStart(2,'0'):'')+' '+s; }
function turnoMapa(){ const m={}; ((S.hor&&S.hor.semanas)||[]).forEach(w=>m[w.semana]=hzKey(w.turno)); return m; }
function baseDia(d){ const k=turnoMapa()[iso(lunDe(d))], T=HZT[k]; if(!T) return null; const dow=d.getDay();
  if(k==='V') return {k,T,vac:true};
  const rg=dow===0?null:dow===6?T.sab:T.lv; const r=hmParse(rg); if(!r) return {k,T,libre:true};
  const br=[]; if(dow>=1&&dow<=5) (T.d||[]).forEach(x=>{ const q=hmParse(x); if(!q) return; let s=q[0],e=q[1]; if(s<r[0]&&r[1]>1440){ s+=1440; e+=1440; } if(s>=r[0]&&e<=r[1]) br.push({s,e,t:x.replace(/\s*\d.*$/,'')}); });
  return {k,T,s:r[0],e:r[1],br,txt:rg}; }
function infoDia(d){ const b=baseDia(d), p=baseDia(addDias(d,-1)); const o={iso:iso(d),k:b&&b.k,T:b&&b.T,vac:b&&b.vac,libre:!b||b.libre||false,segs:[],br:[],txt:b&&b.txt};
  if(b&&b.s!=null){ o.segs.push([b.s,Math.min(b.e,1440)]); (b.br||[]).forEach(x=>{ if(x.s<1440) o.br.push([x.s,Math.min(x.e,1440),x.t]); }); }
  if(p&&p.s!=null&&p.e>1440){ o.segs.push([0,p.e-1440]); (p.br||[]).forEach(x=>{ if(x.e>1440) o.br.push([Math.max(0,x.s-1440),x.e-1440,x.t]); }); o.spill=p; }
  if(o.segs.length) o.libre=false;
  const pe=(S.per||[]).filter(x=>(x.estado==='aprobado'||x.estado==='pendiente')&&String(x.desde).slice(0,10)<=o.iso&&String(x.hasta).slice(0,10)>=o.iso); o.perm=pe; return o; }
function diaDetalle(d){ const o=infoDia(d), hoy=iso(new Date()); const T=o.T; const c=T?T.c:'#64748b';
  const nm=DIAS3[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()];
  let cuerpo;
  if(o.vac) cuerpo='🏖️ Vacaciones';
  else if(o.segs.length){ cuerpo=(o.txt?'<b>'+esc(o.txt)+'</b>':'')+(o.spill&&!o.txt?'<b>Continúa turno de anoche hasta '+hmTxt(o.spill.e)+'</b>':''); if(o.br.length) cuerpo+='<div class="muted" style="margin-top:4px">'+o.br.map(x=>'☕ '+esc(x[2])+' '+hmTxt(x[0])+' – '+hmTxt(x[1])).join('<br>')+'</div>'; }
  else cuerpo=d.getDay()===0?'Domingo: sin turno':T?'Sin turno este día':'Sin horario cargado';
  const pm=o.perm.map(x=>`<div style="margin-top:6px;background:${x.estado==='aprobado'?'#f0fdf4':'#fffbeb'};border-radius:10px;padding:6px 10px;font-size:13px">${(PTIPOS.find(t=>t[0]===x.tipo)||['','📄'])[1]} <b>${esc(x.tipo)}</b> · ${x.estado==='aprobado'?'✅ Aprobado':'⏳ Pendiente'}${x.hora_ini?' · '+esc(x.hora_ini)+(x.hora_fin?' – '+esc(x.hora_fin):''):''}</div>`).join('');
  return `<div class="card" style="border-left:5px solid ${c}"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="text-transform:capitalize">${nm}${o.iso===hoy?' · hoy':''}</b>${T?`<span class="hz-chip" style="background:${c}">${esc(o.k)} · ${esc(T.n)}</span>`:''}</div><div style="margin-top:6px;font-size:14px">${cuerpo}</div>${pm}</div>`; }
function hSwitch(){ const b=(k,t)=>`<button class="${S.hv===k?'on':''}" onclick="S.hv='${k}';pintar()">${t}</button>`; return `<div class="hsw">${b('sem','Semana')}${b('mes','Mes')}${b('lis','Lista')}</div>`; }
function vistaHorario(){
  const tabs=segHtml('hor'); const H=S.hor; if(!H) return tabs+'<div class="empty">Cargando tu horario…</div>';
  if(H.err) return tabs+`<div class="card"><b>⚠️ No se pudo cargar</b><p class="muted" style="margin:6px 0 12px">${esc(H.err)}</p><button class="btn b-pri" onclick="S.hor=null;pintar()">Reintentar</button></div>`;
  if(S.hv==='lis') return tabs+hSwitch()+vistaHorarioLista();
  return tabs+hSwitch()+(S.hv==='mes'?calMes():calSem()); }
function calSem(){
  const hoy=new Date(); hoy.setHours(0,0,0,0); const l0=addDias(lunDe(hoy),S.hOff*7); const dias=Array.from({length:7},(_,i)=>addDias(l0,i)); const inf=dias.map(infoDia);
  let mn=1440,mx=0; inf.forEach(o=>o.segs.forEach(s=>{ mn=Math.min(mn,s[0]); mx=Math.max(mx,s[1]); })); if(mx<=mn){ mn=360; mx=1080; }
  mn=Math.max(0,Math.floor(mn/60)*60-60); mx=Math.min(1440,Math.ceil(mx/60)*60+60); if(mx-mn<600){ mx=Math.min(1440,mn+600); } const HH=34, tot=(mx-mn)/60*HH;
  const sel=S.hSel&&dias.find(d=>iso(d)===S.hSel)?new Date(S.hSel+'T00:00:00'):(dias.find(d=>iso(d)===iso(hoy))||dias[0]);
  const cab=`<div class="cal-nav"><button onclick="S.hOff--;S.hSel=null;pintar()">◀</button><div style="flex:1;text-align:center"><b>${dias[0].getDate()} ${MESES[dias[0].getMonth()].slice(0,3)} – ${dias[6].getDate()} ${MESES[dias[6].getMonth()].slice(0,3)}</b><div class="muted" style="font-size:11px">${S.hOff===0?'Esta semana':S.hOff>0?'En '+S.hOff+' sem.':'Hace '+(-S.hOff)+' sem.'}</div></div><button onclick="S.hOff++;S.hSel=null;pintar()">▶</button>${S.hOff!==0?'<button style="width:auto;padding:0 10px;font-size:12px" onclick="S.hOff=0;S.hSel=null;pintar()">Hoy</button>':''}</div>`;
  const head=`<div class="wk-h"><div></div>${dias.map((d,i)=>{ const o=inf[i]; const hoyB=iso(d)===iso(hoy); return `<div class="${hoyB?'hoy':''} ${iso(d)===iso(sel)?'sel':''}" onclick="S.hSel='${iso(d)}';pintar()"><small>${DIAS3[d.getDay()]}</small><b>${d.getDate()}</b>${o.vac?'<i>🏖</i>':o.perm.length?'<i>'+(o.perm.some(x=>x.estado==='aprobado')?'✅':'⏳')+'</i>':''}</div>`; }).join('')}</div>`;
  const eje=Array.from({length:(mx-mn)/60},(_,i)=>`<div style="height:${HH}px"><span>${hmTxt((mn/60+i)*60).replace(':00','')}</span></div>`).join('');
  const cols=dias.map((d,i)=>{ const o=inf[i], c=o.T?o.T.c:'#64748b';
    const bl=o.segs.map(s=>{ const top=(s[0]-mn)/60*HH, h=Math.max(14,(s[1]-s[0])/60*HH); return `<div class="wk-b" style="top:${top}px;height:${h}px;background:${c}"><b>${esc(o.k)}</b><small>${hmTxt(s[0])}<br>${hmTxt(s[1])}</small></div>`; }).join('');
    const br=o.br.map(x=>`<div class="wk-br" style="top:${(x[0]-mn)/60*HH}px;height:${Math.max(6,(x[1]-x[0])/60*HH)}px"></div>`).join('');
    const va=o.vac?`<div class="wk-b" style="top:0;height:${tot}px;background:repeating-linear-gradient(45deg,#cbd5e1,#cbd5e1 8px,#e2e8f0 8px,#e2e8f0 16px);color:#475569;align-items:center;justify-content:center"><b style="writing-mode:vertical-rl;font-size:12px">🏖 Vacaciones</b></div>`:'';
    const pe=o.perm.length&&!o.vac?`<div class="wk-p ${o.perm.some(x=>x.estado==='aprobado')?'ok':''}" style="height:${tot}px"></div>`:'';
    return `<div class="wk-c ${iso(d)===iso(hoy)?'hoy':''}" style="height:${tot}px" onclick="S.hSel='${iso(d)}';pintar()">${pe}${va}${bl}${br}</div>`; }).join('');
  let nowL=''; if(S.hOff===0){ const n=new Date(); const m=n.getHours()*60+n.getMinutes(); if(m>=mn&&m<=mx) nowL=`<div class="wk-now" style="top:${(m-mn)/60*HH}px"></div>`; }
  return cab+head+`<div class="wk-g"><div class="wk-e">${eje}</div><div class="wk-cs">${cols}${nowL}</div></div><div class="muted" style="font-size:11px;margin:6px 2px 10px">Franja a rayas = descanso/almuerzo · Toca un día para ver el detalle.</div>`+diaDetalle(sel); }
function calMes(){
  const hoy=new Date(); hoy.setHours(0,0,0,0); const b=new Date(hoy.getFullYear(),hoy.getMonth()+S.mOff,1); const ini=lunDe(b); const fin=new Date(b.getFullYear(),b.getMonth()+1,0); const n=Math.ceil(((lunDe(fin)-ini)/864e5+7)/7);
  const sel=S.hSel?new Date(S.hSel+'T00:00:00'):hoy;
  const cab=`<div class="cal-nav"><button onclick="S.mOff--;pintar()">◀</button><div style="flex:1;text-align:center"><b style="text-transform:capitalize">${MESES[b.getMonth()]} ${b.getFullYear()}</b></div><button onclick="S.mOff++;pintar()">▶</button>${S.mOff!==0?'<button style="width:auto;padding:0 10px;font-size:12px" onclick="S.mOff=0;pintar()">Hoy</button>':''}</div>`;
  let g=`<div class="mes-h">${['L','M','M','J','V','S','D'].map(x=>`<div>${x}</div>`).join('')}</div><div class="mes-g">`;
  for(let i=0;i<n*7;i++){ const d=addDias(ini,i), o=infoDia(d), fuera=d.getMonth()!==b.getMonth(), c=o.T?o.T.c:'#94a3b8';
    const tx=o.vac?'🏖':o.segs.length&&o.txt?o.k:o.spill&&!o.segs.some(s=>s[0]>0)?'↩':o.T&&!o.segs.length?'':'';
    const h24=m=>{ m=((m%1440)+1440)%1440; const h=Math.floor(m/60), mi=m%60; return h+(mi?':'+String(mi).padStart(2,'0'):''); }; const b0=baseDia(d); const hr=b0&&b0.s!=null?h24(b0.s)+'-'+h24(b0.e):'';
    g+=`<div class="mes-d ${fuera?'fu':''} ${iso(d)===iso(hoy)?'hoy':''} ${iso(d)===iso(sel)?'sel':''}" onclick="S.hSel='${iso(d)}';pintar()"><span>${d.getDate()}</span>${tx?`<i style="background:${c}">${tx}</i>`:''}${hr&&!o.vac?`<em>${esc(hr)}</em>`:''}${o.perm.length?`<u class="${o.perm.some(x=>x.estado==='aprobado')?'ok':''}"></u>`:''}</div>`; }
  return cab+g+'</div><div class="muted" style="font-size:11px;margin:6px 2px 10px">Punto verde = permiso aprobado · amarillo = pendiente. Toca un día para ver el detalle.</div>'+diaDetalle(sel); }


/* Botón «atrás» del celular: vuelve a la pestaña anterior (o cierra la ventana abierta) en vez de sacarte de la app */
(function(){
  var pv0=pintar, ult=null, pop=false, ini=false;
  pintar=function(){ try{ if(S.ses){ if(!ini){ ini=true; history.replaceState({pv:S.view},''); } else if(ult!==null&&S.view!==ult&&!pop){ history.pushState({pv:S.view},''); } ult=S.view; } else { ult=null; } }catch(e){} return pv0.apply(this,arguments); };
  window.addEventListener('popstate',function(e){
    try{ var ov=$('ov'); if(ov&&ov.classList.contains('open')){ ov.classList.remove('open'); history.pushState({pv:S.view},''); return; }
      var lb=$('lb'); if(lb&&lb.style.display==='flex'){ lb.style.display='none'; history.pushState({pv:S.view},''); return; }
      if(S.ses&&e.state&&e.state.pv&&e.state.pv!==S.view){ pop=true; S.view=e.state.pv; try{ pintar(); }finally{ pop=false; } } }catch(x){} });
})();
